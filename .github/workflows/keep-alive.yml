name: Keep Streamlit alive

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          echo "Checking redirects..."
          curl -s -o /dev/null -w "HTTP: %{http_code}, Redirect: %{redirect_url}" --max-time 30 https://epfl-course-recommender.streamlit.app
          echo ""
          echo "Pinging with more redirects allowed..."
          curl -s -L --max-redirs 20 --max-time 300 -o /dev/null -w "%{http_code}" https://epfl-course-recommender.streamlit.app || true
          echo "Done"
